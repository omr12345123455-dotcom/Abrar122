<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قلب أبرار الأسطوري 🌸</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* حاوية القلب المتوهج */
        .heart-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: heartbeat 1.5s infinite ease-in-out;
        }

        /* رسالة الإطار (كلمات القلب) */
        .heart-text-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(255, 107, 129, 0.3);
            border-radius: 50%;
            animation: rotateRing 15s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* اسم أبرار الفخم في المنتصف */
        .center-name {
            position: absolute;
            font-size: 38px;
            font-weight: 900;
            background: linear-gradient(45deg, #ff4d6d, #ff758c, #ffb3c6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
            letter-spacing: 3px;
            z-index: 10;
            animation: nameGlow 2s infinite alternate;
        }

        .subtitle {
            position: absolute;
            bottom: 40px;
            font-size: 16px;
            color: #ffb3c6;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* الحركات والتأثيرات (Animations) */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes nameGlow {
            0% { text-shadow: 0 0 10px rgba(255, 77, 109, 0.4); transform: scale(1); }
            100% { text-shadow: 0 0 30px rgba(255, 77, 109, 0.9); transform: scale(1.03); }
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* تصميم شكل القلب الهندسي بالخلفية */
        .glow-heart {
            position: absolute;
            width: 260px;
            height: 260px;
            background: rgba(255, 77, 109, 0.15);
            transform: rotate(45deg);
            box-shadow: 0 0 50px rgba(255, 77, 109, 0.3);
            filter: blur(10px);
        }
        .glow-heart::before, .glow-heart::after {
            content: '';
            position: absolute;
            width: 260px;
            height: 260px;
            background: rgba(255, 77, 109, 0.15);
            border-radius: 50%;
        }
        .glow-heart::before { top: -130px; left: 0; }
        .glow-heart::after { left: -130px; top: 0; }
    </style>
</head>
<body>

    <div class="heart-container">
        <!-- خلفية القلب المضيء -->
        <div class="glow-heart"></div>
        
        <!-- اسم أبرار الساطع في النص -->
        <div class="center-name">ABRAR</div>
    </div>

    <div class="subtitle">عالم طفلتي المدللة وسنجابي الصغير 🌸</div>

</body>
</html>
